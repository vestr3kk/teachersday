<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MS ELIMMM</title>


<style>
* { box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
}

body {
  font-family: Georgia, "Times New Roman", serif;
  background:
    radial-gradient(circle at 50% 45%, #3b1d27 0%, #241319 55%, #180d12 100%);
  overflow: hidden;
  color: #ead9c5;
}

.app {
  width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 112px 20px 76px;
}

h1 {
  position: absolute;
  top: 30px;
  left: 50%;
  transform: translateX(-50%);
  margin: 0;
  z-index: 2;

  font-family: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
  font-size: clamp(29px, 5vw, 48px);
  font-weight: 500;
  font-style: italic;
  letter-spacing: 1.5px;
  color: #ead9c5;

  text-shadow:
    0 2px 18px rgba(196, 155, 111, .22);

  white-space: nowrap;
}

.subtitle {
  position: absolute;
  top: 76px;
  left: 50%;
  transform: translateX(-50%);
  margin: 0;
  color: #ead9c5;
  font-size: clamp(19px, 3vw, 25px);
  letter-spacing: .5px;
  white-space: nowrap;
  opacity: .92;
}

.greeting {
  position: absolute;
  top: 99px;
  left: 50%;
  transform: translateX(-50%);
  margin: 0;
  color: #ead9c5;
  font-size: clamp(11px, 1.8vw, 14px);
  letter-spacing: .35px;
  white-space: nowrap;
  opacity: .82;
}

.footer-message {
  position: absolute;
  bottom: 86px;
  left: 16px;
  right: 16px;
  margin: 0;
  text-align: center;
  color: #ead9c5;
  font-size: clamp(13px, 2.2vw, 17px);
  letter-spacing: .35px;
  line-height: 1.4;
}

.wheel-area {
  position: relative;
  width: min(68vh, 520px, 78vw);
  aspect-ratio: 1;
}

#wheel {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  display: block;

  border: 9px solid #ead9c5;

  background: #512330;

  box-shadow:
    0 0 0 3px rgba(83, 117, 79, .45),
    0 15px 55px rgba(0, 0, 0, .55),
    0 0 45px rgba(95, 55, 64, .28);

  cursor: pointer;

  transition:
    transform 4s cubic-bezier(.12,.8,.15,1);
}

.pointer {
  position: absolute;
  top: -7px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;

  width: 0;
  height: 0;

  border-left: 19px solid transparent;
  border-right: 19px solid transparent;
  border-top: 38px solid #ead9c5;

  filter:
    drop-shadow(0 3px 5px rgba(0,0,0,.55));
}

.center-button {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);

  width: 78px;
  height: 78px;

  border-radius: 50%;
  border: 5px solid #ead9c5;

  background: #6f293d;

  color: #ead9c5;

  font-family: Georgia, serif;
  font-size: 12px;
  letter-spacing: 2px;
  font-weight: bold;

  display: flex;
  align-items: center;
  justify-content: center;

  pointer-events: none;

  box-shadow:
    0 0 0 3px rgba(45, 72, 44, .8),
    0 5px 20px rgba(0,0,0,.4);
}

/* IMAGE POPUP */
.popup {
  position: fixed;
  inset: 0;
  z-index: 20;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 30px;

  background: rgba(18, 8, 12, .78);

  backdrop-filter: blur(9px);

  opacity: 0;
  visibility: hidden;

  transition:
    opacity .22s ease,
    visibility .22s ease;
}

.popup.show {
  opacity: 1;
  visibility: visible;
}

.popup-card {
  position: relative;

  max-width: 90vw;
  max-height: 90vh;

  padding: 11px;

  border-radius: 22px;

  background:
    linear-gradient(145deg, #ead9c5, #c49b6f);

  box-shadow:
    0 25px 80px rgba(0,0,0,.65),
    0 0 35px rgba(108, 42, 60, .35);

  animation: pop .28s ease;
}

.popup-card img {
  display: block;

  max-width: 86vw;
  max-height: 84vh;

  width: auto;
  height: auto;

  object-fit: contain;

  border-radius: 13px;

  background: #241319;
}

.close {
  position: absolute;
  right: -15px;
  top: -15px;

  width: 39px;
  height: 39px;

  border: 2px solid #ead9c5;
  border-radius: 50%;

  background: #6f293d;
  color: #ead9c5;

  font-size: 26px;
  line-height: 34px;

  padding: 0;
  cursor: pointer;

  z-index: 2;

  box-shadow: 0 5px 18px rgba(0,0,0,.5);

  transition: transform .15s ease, background .15s ease;
}

.close:hover {
  transform: scale(1.08);
  background: #8a344b;
}

@keyframes pop {
  from {
    opacity: 0;
    transform: scale(.91) translateY(8px);
  }
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

@media (max-height: 650px) {
  .app {
    padding-top: 92px;
    padding-bottom: 58px;
  }

  .wheel-area {
    width: min(52vh, 420px, 70vw);
  }

  h1 {
    top: 12px;
    font-size: 30px;
  }

  .subtitle {
    top: 49px;
  }

  .greeting {
    top: 69px;
    font-size: 11px;
  }

  .footer-message {
    bottom: 62px;
    font-size: 13px;
  }
}

@media (max-width: 500px) {
  .wheel-area {
    width: min(78vw, 52vh);
  }

  h1 {
    font-size: clamp(26px, 8vw, 38px);
  }

  .subtitle {
    top: 73px;
  }

  .greeting {
    top: 95px;
    font-size: 11px;
  }

  .footer-message {
    bottom: 64px;
    font-size: 13px;
  }

  .center-button {
    width: 65px;
    height: 65px;
  }

  .popup {
    padding: 15px;
  }

  .popup-card img {
    max-width: 92vw;
    max-height: 86vh;
  }
}

.music-control {
  position: fixed; top: 18px; right: 18px; z-index: 30;
  display: inline-flex; align-items: center; gap: 7px;
  padding: 9px 13px; border: 1px solid rgba(234,217,197,.75);
  border-radius: 999px; background: rgba(81,35,48,.9);
  color: #ead9c5; font: 13px Georgia,serif; letter-spacing: .3px;
  cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,.25);
  backdrop-filter: blur(6px);
}
.music-control:hover { background: #6f293d; }
.music-control:focus-visible { outline: 2px solid #ead9c5; outline-offset: 3px; }
@media (max-width: 500px) {
  .music-control { top: 12px; right: 10px; padding: 7px 10px; font-size: 12px; }
}

</style>


</head>

<body>

<audio id="backgroundMusic" src="music/alyssa-grace-bloodstream.mp3" preload="auto" loop></audio>
<button id="musicToggle" class="music-control" type="button" aria-pressed="false" aria-label="Toggle background music">♫</button>

<div class="app">
  <h1>Happy Teachers Day,<br>Ms Elim</h1>
  <p class="subtitle"></p>
  <p class="greeting"></p>
</div>

  <div class="wheel-area">
    <div class="pointer"></div>
    <canvas id="wheel" width="700" height="700"></canvas>
    <div class="center-button" aria-label="Spin the wheel"></div>
  </div>
  <p class="footer-message"></p>
</div>

<div id="popup" class="popup">
  <div class="popup-card">
    <button id="closePopup" class="close">×</button>
    <img id="resultImage" alt="Selected image">
  </div>
</div>

<script>

const backgroundMusic = document.getElementById("backgroundMusic");
const musicToggle = document.getElementById("musicToggle");

function updateMusicButton() {
  const playing = !backgroundMusic.paused;
  musicToggle.textContent = "♫";
  musicToggle.setAttribute("aria-pressed", String(playing));
}

async function startMusic() {
  try { await backgroundMusic.play(); } catch (error) {}
  updateMusicButton();
}

function stopMusic() {
  backgroundMusic.pause();
  updateMusicButton();
}

musicToggle.addEventListener("click", () => {
  if (backgroundMusic.paused) startMusic();
  else stopMusic();
});
backgroundMusic.addEventListener("play", updateMusicButton);
backgroundMusic.addEventListener("pause", updateMusicButton);

const imageFiles = [
  'images/4.png', 'images/5.png', 'images/6.png', 'images/7.png',
  'images/8.png', 'images/9.png', 'images/10.png', 'images/11.png',
  'images/12.png', 'images/13.png', 'images/14.png', 'images/15.png',
  'images/16.png', 'images/17.png', 'images/18.png', 'images/19.png',
  'images/20.png', 'images/22.png', 'images/23.png', 'images/24.png',
  'images/25.png', 'images/26.png', 'images/27.png', 'images/28.png'
];

let availableImages = [...imageFiles];
let isSpinning = false;
let currentRotation = 0;

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const size = canvas.width;
const center = size / 2;
const radius = size / 2 - 10;

const colors = [
  "#6f293d", "#9a4054", "#9caf88", "#b8c79f",
  "#c49b6f", "#a9825d", "#7f9a72", "#ead9c5"
];

function drawWheel() {
  ctx.clearRect(0, 0, size, size);

  if (availableImages.length === 0) {
    ctx.beginPath();
    ctx.arc(center, center, radius, 0, Math.PI * 2);
    ctx.fillStyle = "#512330";
    ctx.fill();
    ctx.fillStyle = "#ead9c5";
    ctx.font = "bold 28px Georgia";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("ALL DONE!", center, center);
    return;
  }

  const slice = (Math.PI * 2) / availableImages.length;

  for (let i = 0; i < availableImages.length; i++) {
    const start = -Math.PI / 2 + i * slice;
    const end = start + slice;

    ctx.beginPath();
    ctx.moveTo(center, center);
    ctx.arc(center, center, radius, start, end);
    ctx.closePath();
    ctx.fillStyle = colors[i % colors.length];
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.72)";
    ctx.lineWidth = 2;
    ctx.stroke();

  }

  ctx.beginPath();
  ctx.arc(center, center, 39, 0, Math.PI * 2);
  ctx.fillStyle = "#6f293d";
  ctx.fill();
  ctx.strokeStyle = "#ead9c5";
  ctx.lineWidth = 4;
  ctx.stroke();
}

drawWheel();
canvas.addEventListener("click", spinWheel);

function spinWheel() {
  if (isSpinning || availableImages.length === 0) return;

  isSpinning = true;
  if (backgroundMusic.paused) startMusic();

  // Choose one remaining image, then rotate its slice to the pointer at the top.
  const selectedIndex = Math.floor(Math.random() * availableImages.length);
  const selectedImage = availableImages[selectedIndex];
  const sliceDegrees = 360 / availableImages.length;
  const desiredAngle = (360 - ((selectedIndex + 0.5) * sliceDegrees)) % 360;
  const currentAngle = ((currentRotation % 360) + 360) % 360;
  const adjustment = (desiredAngle - currentAngle + 360) % 360;
  const extraSpins = 5 + Math.floor(Math.random() * 4);

  currentRotation += extraSpins * 360 + adjustment;
  canvas.style.transform = `rotate(${currentRotation}deg)`;

  window.setTimeout(() => {
    const resultImage = document.getElementById("resultImage");
    resultImage.onerror = () => {
      resultImage.style.display = "none";
      alert("Could not load the selected image: " + selectedImage);
    };
    resultImage.onload = () => {
      resultImage.style.display = "block";
    };
    resultImage.alt = "Selected image";
    resultImage.src = selectedImage;

    // Remove it only after it has been selected and the spin has finished.
    availableImages.splice(selectedIndex, 1);
    drawWheel();

    document.getElementById("popup").classList.add("show");
    isSpinning = false;
  }, 4100);
}

document.getElementById("closePopup").addEventListener("click", closePopup);

document.getElementById("popup").addEventListener("click", event => {
  if (event.target.id === "popup") closePopup();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closePopup();
});

function closePopup() {
  document.getElementById("popup").classList.remove("show");
}

// The remaining-image list is intentionally kept in memory only.
// Refreshing the page restores all 24 images.
</script>
</body>

</html>
